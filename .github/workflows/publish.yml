name: Publish Package to npm

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): npm publish authenticates with the job's GitHub OIDC token.
      # Trusted publisher on npmjs.com: foo-ogawa/mdjournal + publish.yml (no environment).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Clean and install dependencies
        run: |
          rm -rf node_modules client/node_modules server/node_modules
          rm -f package-lock.json client/package-lock.json server/package-lock.json
          npm install

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Trusted publishing needs npm CLI 11.5.1 or later; setup-node installs npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: npm publish





